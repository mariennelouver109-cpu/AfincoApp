<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Boletim</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    
<header>
    <h1>Boletim</h1>
</header>

<main>
    <table>
        <thead>
            <tr>
                <th>Matéria</th>
                <th>Nota Final</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${boletim}">
                <td th:text="${entry.materia}"></td>
                <td th:text="${entry.nota}"></td>
            </tr>
        </tbody>
    </table>

    <p><strong>Média Geral:</strong> <span th:text="${media}"></span></p>

    <nav class="btn-group">
        <button type="button" class="btn btn-primary" onclick="window.print()">🖨️ Imprimir</button>
        <a th:href="@{/menu}" class="btn btn-secondary">← Voltar</a>
    </nav>
</main>
</body>
</html>
