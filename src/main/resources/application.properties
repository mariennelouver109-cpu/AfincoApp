spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pooling for 3-day stability test (free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.auto-commit=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Session configuration - extend timeout to 8 hours
server.servlet.session.timeout=28800s

supabase.storage.url=https://thehswegxkrchohogcrg.supabase.co
supabase.storage.api-key=${SUPABASE_KEY}
supabase.storage.bucket-name=AfincoStorage
supabase.storage.project-id=thehswegxkrchohogcrg

#port
server.port=${PORT:8080}
